<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <header class="page-title">
            <h1>Visitor Registration System</h1>
            <p>VISITOR CHECK-IN PORTAL</p>
        </header>

        <main class="container">
            <section class="image-box" aria-label="Visitor illustration section">
                <img src="../register-removebg-preview.png" alt="Visitor registration illustration" onerror="this.style.display='none'">
                <h2>Welcome Visitor</h2>
                <p>Register guest details quickly and keep a smooth check-in process.</p>
            </section>

            <section class="form-box" aria-label="Visitor registration form">
                <h2>Register Visitor</h2>
                <p class="subtitle">Enter the visitor details below:</p>

                <form id="visitorForm" novalidate>
                    <label for="visitorName">Visitor Name</label>
                    <input type="text" id="visitorName" placeholder="Enter visitor name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter email" required>

                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" placeholder="Enter phone number" required>

                    <label for="company">Company Name</label>
                    <input type="text" id="company" placeholder="Enter company name" required>

                    <label for="purpose">Purpose of Visit</label>
                    <input type="text" id="purpose" placeholder="Enter visit purpose" required>

                    <label for="visitorType">Visitor Type</label>
                    <select id="visitorType" required>
                        <option value="">Select visitor type</option>
                        <option value="Guest">Guest</option>
                        <option value="Client">Client</option>
                        <option value="Vendor">Vendor</option>
                        <option value="Employee">Employee</option>
                    </select>

                    <label for="visitDate">Visit Date</label>
                    <input type="date" id="visitDate" required>

                    <label for="visitTime">Visit Time</label>
                    <input type="time" id="visitTime" required>

                    <button type="submit">Submit Visitor</button>
                </form>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
